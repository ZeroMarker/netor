[package]
name = "netor"
version = "0.1.0"
edition = "2021"
description = "System-level network traffic monitor for interface rates, live TCP connections and DNS/TLS SNI domains"
readme = "README.md"
license = "MIT"
repository = "https://github.com/ZeroMarker/netor"
homepage = "https://github.com/ZeroMarker/netor"
keywords = ["network", "monitor", "traffic", "netstat", "pcap"]
categories = ["command-line-utilities", "network-programming", "os::unix-apis"]

[features]
default = ["npcap"]
npcap = ["dep:pcap"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
ctrlc = "3.5.2"
sysinfo = "0.38.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
pcap = { version = "2.4", optional = true }
